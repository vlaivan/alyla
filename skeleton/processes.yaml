      - {key: tyonantajayhteistyo_ja_rekrytointien_tuki, name: "Työnantajayhteistyö ja rekrytointien tuki", unit: tyonantajapalvelut, realizes: [tyonantaja_ja_rekrytointipalvelut]}
      - {key: palkkatukien_ja_muiden_tukien_kasittely, name: "Palkkatukien ja muiden tukien käsittely", unit: tyollistamisen_tuet, realizes: [palkkatuki_ja_muut_tyollistamisen_tuet]}
  - key: kotoutumisen_edistaminen
