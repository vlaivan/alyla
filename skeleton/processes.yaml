# Älylän kaupunki: prosessit

# Two levels: process groups and their processes. The governance, core and support split follows the
# municipal management reference architecture; the substance comes from the divisions' own work.

# Attributes:
#   key, name: as in organisation.yaml.
#   kind: governance | core | support (process groups).
#   unit: organisation key of the responsible unit or sub-unit.
#   realizes: service keys (optional).


process_groups:
  # --- Governance
  - key: strategiaprosessi
    name: "Strategiaprosessi"
    kind: governance
    unit: strategia_ja_kehittaminen
    processes:
      - {key: kaupunkistrategian_valmistelu_ja_hyvaksyminen, name: "Kaupunkistrategian valmistelu ja hyväksyminen", unit: strategia_ja_tietojohtaminen}
      - {key: strategian_toimeenpano_ja_seuranta, name: "Strategian toimeenpano ja seuranta", unit: strategia_ja_tietojohtaminen, realizes: [tietojohtamisen_ja_raportoinnin_palvelut]}
      - {key: hyvinvointikertomuksen_ja_suunnitelman_laadinta, name: "Hyvinvointikertomuksen ja -suunnitelman laadinta", unit: hyvinvoinnin_edistaminen, realizes: [hyvinvoinnin_ja_terveyden_edistaminen]}
  - key: talous_ja_tulosohjaus
    name: "Talous- ja tulosohjaus"
    kind: governance
    unit: talouspalvelut
    processes:
      - {key: talousarvion_ja_suunnitelman_laadinta, name: "Talousarvion ja -suunnitelman laadinta", unit: talousohjaus_ja_budjetointi, realizes: [talousarvio_ja_talousohjauspalvelu]}
      - {key: toiminnan_ja_talouden_seuranta_ja_raportointi, name: "Toiminnan ja talouden seuranta ja raportointi", unit: talousohjaus_ja_budjetointi, realizes: [talousarvio_ja_talousohjauspalvelu, tietojohtamisen_ja_raportoinnin_palvelut]}
      - {key: tilinpaatos_ja_toimintakertomus, name: "Tilinpäätös ja toimintakertomus", unit: talousohjaus_ja_budjetointi}
  - key: paatoksenteko
    name: "Päätöksenteko"
    kind: governance
    unit: hallinto_ja_lakipalvelut
    processes:
      - {key: asian_valmistelu_ja_esittely, name: "Asian valmistelu ja esittely", unit: paatoksenteon_tuki, realizes: [paatoksenteon_valmistelu_ja_kokouspalvelut]}
      - {key: kokousmenettely_ja_poytakirjat, name: "Kokousmenettely ja pöytäkirjat", unit: paatoksenteon_tuki, realizes: [paatoksenteon_valmistelu_ja_kokouspalvelut]}
      - {key: viranhaltijapaatosten_tekeminen_ja_julkaisu, name: "Viranhaltijapäätösten tekeminen ja julkaisu", unit: paatoksenteon_tuki}
      - {key: oikaisuvaatimusten_ja_valitusten_kasittely, name: "Oikaisuvaatimusten ja valitusten käsittely", unit: lakipalvelut, realizes: [oikeudellinen_neuvonta]}
  - key: kehittamisen_ohjaus
    name: "Kehittämisen ohjaus"
    kind: governance
    unit: strategia_ja_kehittaminen
    processes:
      - {key: kehittamissalkun_hallinta, name: "Kehittämissalkun hallinta", unit: strategia_ja_tietojohtaminen}
      - {key: kokonaisarkkitehtuurin_hallinta, name: "Kokonaisarkkitehtuurin hallinta", unit: arkkitehtuuri_ja_tiedonhallinta, realizes: [arkkitehtuuri_ja_tiedonhallintapalvelut]}
      - {key: digitaalisten_palvelujen_kehittaminen, name: "Digitaalisten palvelujen kehittäminen", unit: digitaalinen_asiointi, realizes: [sahkoinen_asiointi_kaupungin_verkkopalvelussa]}
  - key: konserniohjaus_ja_riskienhallinta
    name: "Konserniohjaus ja riskienhallinta"
    kind: governance
    unit: omistajaohjaus
    processes:
      - {key: omistajaohjaus, name: "Omistajaohjaus", unit: omistajaohjaus, realizes: [konserniyhteisojen_omistajaohjaus]}
      - {key: riskienhallinta_ja_sisainen_valvonta, name: "Riskienhallinta ja sisäinen valvonta", unit: talousohjaus_ja_budjetointi}

  # --- Core: Konsernihallinto
  - key: asiakaspalvelu_ja_asiointi
    name: "Asiakaspalvelu ja asiointi"
    kind: core
    unit: asiakaspalvelu
    processes:
      - {key: neuvonta_ja_asiakasohjaus, name: "Neuvonta ja asiakasohjaus", unit: palvelupiste_alyla_info, realizes: [neuvonta_ja_asiointi_palvelupisteessa]}
      - {key: sahkoisen_asioinnin_vastaanotto_ja_ohjaus, name: "Sähköisen asioinnin vastaanotto ja ohjaus", unit: digitaalinen_asiointi, realizes: [sahkoinen_asiointi_kaupungin_verkkopalvelussa]}
