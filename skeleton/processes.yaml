      - {key: elinkeinoavustusten_kasittely, name: "Elinkeinoavustusten käsittely", unit: elinkeinokehitys_ja_investoinnit, realizes: [elinkeinoavustukset]}
  - key: tyollisyyspalvelut
    name: "Työllisyyspalvelut"
    kind: core
    unit: tyollisyyspalvelut
    processes:
      - {key: tyonhakuasiakkuuden_aloitus_ja_palvelutarpeen_arviointi, name: "Työnhakuasiakkuuden aloitus ja palvelutarpeen arviointi", unit: tyonhakijapalvelut, realizes: [tyonhakijan_palvelut_ja_ohjaus]}
      - {key: tyonhakuvelvollisuuden_seuranta_ja_tyovoimapoliittiset_lausunnot, name: "Työnhakuvelvollisuuden seuranta ja työvoimapoliittiset lausunnot", unit: tyonhakijapalvelut, realizes: [tyonhakijan_palvelut_ja_ohjaus]}
