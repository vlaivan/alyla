# service names are fictional; national services mirror real ones by role. Long-tail systems are created
# by the generator from the archetypes with the world seed.

# Attributes:
#   key, name: as in organisation.yaml.  purpose: Finnish description.
#   unit: responsible unit; owner_external: the owning organisation of black-box and national systems.
#   vendor, deployment (saas | on_prem | cloud | national_service), criticality, personal_data.
#   hosting: a profile from hosting_profiles (platforms and system software the system runs on).
#   serves: process keys.  reads / writes: information keys.  laws: constraint keys regulating the system.
#   used_by: divisions or units that use the system beyond its own unit.
#   flows: from, to, payload, via (vayla = city integration platform | direct | national_layer = national data
#          exchange layer | file = file transfer).
#   long_tail: archetype, unit (a key, a list or any_unit), count, serves (process keys or unit_processes),
#          hosting weights and a pool of names.


